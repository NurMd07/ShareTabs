<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Share Tabs</title>
  <link href="bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --panel-border: rgba(148, 163, 184, 0.18);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --blue: #60a5fa;
    }

    * { box-sizing: border-box; }

    body {
      width: 340px;
      margin: 0;
      color: var(--text);
      background: radial-gradient(circle at top right, rgba(52, 211, 153, 0.12), transparent 34%), linear-gradient(145deg, #07111f, #0d1b2c);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .popup-shell { padding: 20px; }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .brand-icon { width: 44px; height: 44px; border: 1px solid var(--panel-border); border-radius: 14px; }
    .brand-title { margin: 0; font-size: 1.2rem; font-weight: 750; }
    .brand-subtitle { margin: 3px 0 0; color: var(--muted); font-size: 0.78rem; }
    .send-panel { padding: 18px; border: 1px solid var(--panel-border); border-radius: 18px; background: rgba(16, 28, 45, 0.88); }
    .panel-title { margin: 0; font-size: 1rem; font-weight: 700; }
    .panel-description { margin: 5px 0 16px; color: var(--muted); font-size: 0.78rem; line-height: 1.45; }
    .field-label { display: block; margin-bottom: 5px; color: #cbd5e1; font-size: 0.78rem; font-weight: 600; }
    .credential-input {
      width: 100%; height: 40px; margin-bottom: 13px; padding: 0 12px;
      border: 1px solid rgba(148, 163, 184, 0.24); border-radius: 10px;
      outline: none; background: #0a1422; color: var(--text); font: inherit; font-size: 0.88rem;
    }
    .credential-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.14); }
    .tab-toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 2px 0 16px; cursor: pointer; }
    .toggle-copy strong, .toggle-copy small { display: block; }
    .toggle-copy strong { font-size: 0.8rem; font-weight: 600; }
    .toggle-copy small { margin-top: 2px; color: var(--muted); font-size: 0.7rem; }
    .tab-toggle input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .switch-track { position: relative; flex: 0 0 auto; width: 38px; height: 22px; border: 1px solid rgba(148, 163, 184, 0.28); border-radius: 999px; background: #26364a; }
    .switch-track::after { position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #cbd5e1; content: ""; transition: transform 0.18s ease; }
    .tab-toggle input:checked + .switch-track { background: #087c61; }
    .tab-toggle input:checked + .switch-track::after { transform: translateX(16px); background: white; }
    .tab-toggle input:focus-visible + .switch-track { outline: 2px solid var(--blue); outline-offset: 3px; }
    .button-row { display: flex; gap: 8px; }
    .send-button, .logout-button {
      display: flex; align-items: center; justify-content: center; min-height: 44px;
      border: 1px solid rgba(52, 211, 153, 0.35); border-radius: 12px;
      background: linear-gradient(135deg, #34d399, #10b981); color: #052e25;
      font-size: 0.9rem; font-weight: 750; cursor: pointer;
    }
    .send-button { flex: 1; }
    .send-button:disabled { cursor: wait; opacity: 0.72; }
    .logout-button { padding: 0 12px; border-color: var(--panel-border); background: transparent; color: var(--text); }
    .status { min-height: 1.2rem; margin: 10px 0 0; color: var(--muted); font-size: 0.74rem; line-height: 1.4; overflow-wrap: anywhere; }
    .popup-footer { margin: 14px 0 0; color: var(--muted); font-size: 0.72rem; text-align: center; }
  </style>
</head>
<body>
  <main class="popup-shell">
    <header class="brand">
      <img class="brand-icon" src="64.png" alt="">
      <div>
        <h1 class="brand-title">Share Tabs</h1>
        <p class="brand-subtitle">Send pages to your dashboard</p>
      </div>
    </header>

    <section class="send-panel" aria-labelledby="send-heading">
      <h2 class="panel-title" id="send-heading">Connect your dashboard</h2>
      <p class="panel-description">Enter your dashboard domain and credentials. Details are saved after tabs are sent successfully.</p>

      <div class="credentials">
        <label class="field-label" for="domain">Dashboard domain</label>
        <input class="credential-input" id="domain" name="domain" type="text" autocomplete="url" spellcheck="false" placeholder="example.com" required>

        <label class="field-label" for="username">Username</label>
        <input class="credential-input" id="username" name="username" type="text" autocomplete="username" spellcheck="false" placeholder="Enter username" required>

        <label class="field-label" for="password">Password</label>
        <input class="credential-input" id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
      </div>

      <p class="signed-in" hidden></p>

      <label class="tab-toggle" for="current-tab-only">
        <span class="toggle-copy">
          <strong>Current tab only</strong>
          <small>Otherwise, send all open tabs</small>
        </span>
        <input type="checkbox" id="current-tab-only" aria-label="Send current tab only">
        <span class="switch-track" aria-hidden="true"></span>
      </label>

      <div class="button-row">
        <button type="button" class="send-button">Send All Tabs</button>
        <button type="button" class="logout-button" hidden>Log out</button>
      </div>
      <p class="status" role="status" aria-live="polite"></p>
    </section>

    <p class="popup-footer">Sent pages appear in your Share Tabs dashboard.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
